spring.application.name=ExamPro
server.port=${PORT:8080}

# Database Connection (MySQL / Aiven / Local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/exampro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}

# HikariCP Connection Pool (Optimized for Free Tier constraints)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Security
app.jwt.secret=${JWT_SECRET:local-only-secret-change-this-to-at-least-32-bytes-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}}

# Documentation
springdoc.swagger-ui.path=/swagger-ui.html

# Initial Admin Bootstrap (Optional)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:ExamPro Administrator}
